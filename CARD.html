<html lang="en">
<head>

<title>Ankur Nahata — Mishthi Chai</title>
<meta name="description" content="Ankur Nahata, Founder — Mishthi Chai. Tradition Brewed to Perfection">
<meta name="theme-color" content="#f2e7da">

<style>
  :root{
    --cream:#f2e7da;
    --green:#1a3125;
    --gold:#a87a38;

    --paper:#fbf6ef;
    --ink:#16281d;
    --muted:#6d6055;
    --line:rgba(26,49,37,.13);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Segoe UI",-apple-system,BlinkMacSystemFont,Roboto,"Helvetica Neue",Arial,sans-serif;
    background:var(--cream);
    color:var(--ink);
    min-height:100vh;min-height:100dvh;
    display:flex;justify-content:center;
    padding:0 15px calc(30px + env(safe-area-inset-bottom));
    overflow-x:hidden;
    position:relative;
  }
  /* chai-cup + tea-leaf wallpaper (inline SVG data-URI, works offline) */
  body::before{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.15;
    background-repeat:repeat;
    background-size:190px 190px;
    background-image:url("data:image/svg+xml;utf8,\
<svg xmlns='http://www.w3.org/2000/svg' width='150' height='150' viewBox='0 0 150 150'>\
<g fill='none' stroke='%23a87a38' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'>\
<path d='M26 46h26v9a13 13 0 0 1-26 0z'/>\
<path d='M52 49h5a5 5 0 0 1 0 10h-1'/>\
<path d='M23 71h32'/>\
<path d='M34 36c-3-3 0-6 0-9M40 36c-3-3 0-6 0-9M46 36c-3-3 0-6 0-9'/>\
<path d='M101 121h26v9a13 13 0 0 1-26 0z'/>\
<path d='M127 124h5a5 5 0 0 1 0 10h-1'/>\
<path d='M98 146h32'/>\
<path d='M109 111c-3-3 0-6 0-9M115 111c-3-3 0-6 0-9M121 111c-3-3 0-6 0-9'/>\
<path d='M96 34c7-8 17-10 26-8-1 9-7 17-16 19-6 1-10-4-10-11z'/>\
<path d='M99 47c8-7 15-13 23-19'/>\
<path d='M24 111c7-8 17-10 26-8-1 9-7 17-16 19-6 1-10-4-10-11z'/>\
<path d='M27 124c8-7 15-13 23-19'/>\
</g></svg>");
  }
  /* fine paper grain on top of the pattern */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.5;
    background-image:radial-gradient(circle at 1px 1px, rgba(26,49,37,.05) 1px, transparent 0);
    background-size:22px 22px;
  }
  .wrap{width:100%;max-width:430px;position:relative;z-index:2}

  /* ================= HERO (green curved panel like the card) ============ */
  .hero{
    position:relative;
    margin:0 -15px 0;
    padding:34px 26px 0;
    text-align:center;
    overflow:hidden;
  }
  .hero .leafbg{
    position:absolute;top:-16px;right:-30px;width:128px;opacity:.30;
    stroke:var(--gold);fill:none;stroke-width:1.5;pointer-events:none;
    transform:rotate(12deg);
  }
  .hero .leafbg2{
    position:absolute;top:128px;left:-36px;width:96px;opacity:.20;
    stroke:var(--gold);fill:none;stroke-width:1.5;pointer-events:none;
    transform:rotate(196deg);
  }

  /* avatar / monogram */
  .avatar{
    width:112px;height:112px;margin:0 auto 16px;position:relative;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    background:linear-gradient(150deg,#22422f,var(--green));
    color:var(--cream);
    font-size:34px;font-weight:700;letter-spacing:2px;
    border:2.5px solid var(--gold);
    box-shadow:0 14px 34px rgba(26,49,37,.26), inset 0 0 0 6px rgba(242,231,218,.10);
    overflow:hidden;
    animation:pop .55s cubic-bezier(.2,.9,.3,1.3) both;
  }
  .avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
  @keyframes pop{from{opacity:0;transform:scale(.78)}to{opacity:1;transform:none}}

  .brandline{
    font-size:11px;font-weight:700;letter-spacing:4px;text-transform:uppercase;
    color:var(--gold);margin-bottom:9px;
  }
  h1{
    font-size:29px;font-weight:800;letter-spacing:-.3px;color:var(--green);
    line-height:1.15;margin-bottom:5px;
  }
  .role{
    font-family:Georgia,"Times New Roman",serif;font-style:italic;
    font-size:16px;color:var(--muted);margin-bottom:14px;
  }

  /* gold ornamental divider (from the printed card) */
  .orn{display:flex;align-items:center;justify-content:center;gap:9px;margin:0 auto 14px;max-width:230px}
  .orn i{flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.75}
  .orn svg{width:20px;height:11px;stroke:var(--gold);fill:none;stroke-width:1.5;flex:none}

  .tagline{
    font-size:12.5px;font-weight:700;letter-spacing:2.6px;text-transform:uppercase;
    color:var(--green);opacity:.78;
  }

  .banner{
    display:inline-flex;align-items:center;gap:8px;
    margin-top:16px;padding:8px 17px;
    background:rgba(26,49,37,.06);
    border:1px solid rgba(26,49,37,.16);
    border-radius:100px;
    font-size:12.5px;font-weight:600;color:var(--green);
  }
  .dot{width:7px;height:7px;border-radius:50%;background:#2f8f4e;
       box-shadow:0 0 0 0 rgba(47,143,78,.55);animation:pulse 2.2s infinite}
  @keyframes pulse{70%{box-shadow:0 0 0 8px rgba(47,143,78,0)}100%{box-shadow:0 0 0 0 rgba(47,143,78,0)}}

  /* ================= QUICK ACTIONS ============ */
  .quick{display:flex;gap:9px;margin:26px 0 22px}
  .qbtn{
    flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;
    padding:14px 3px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:15px;
    color:var(--green);text-decoration:none;
    font-size:11px;font-weight:700;letter-spacing:.4px;
    box-shadow:0 2px 8px rgba(26,49,37,.05);
    transition:transform .15s,box-shadow .2s,background .2s;
  }
  .qbtn svg{width:21px;height:21px;stroke:none;fill:var(--gold);color:var(--gold)}
  .qbtn:active{transform:scale(.94);background:#fff;box-shadow:0 1px 3px rgba(26,49,37,.06)}

  /* ================= LINKS ============ */
  .links{display:flex;flex-direction:column;gap:11px}
  .lnk{
    display:flex;align-items:center;gap:14px;
    padding:15px 17px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:15px;
    color:var(--ink);text-decoration:none;
    box-shadow:0 2px 8px rgba(26,49,37,.05);
    transition:transform .15s,box-shadow .2s,background .2s;
    animation:slide .45s ease both;
  }
  @keyframes slide{from{opacity:0;transform:translateY(13px)}to{opacity:1;transform:none}}
  .lnk:active{transform:scale(.98);background:#fff}

  /* highlighted = deep green with gold, exactly like card back */
  .lnk.hl{
    background:linear-gradient(140deg,#22422f,var(--green));
    border-color:var(--gold);
    box-shadow:0 10px 26px rgba(26,49,37,.28);
  }
  .lnk.hl .ttl{color:var(--cream)}
  .lnk.hl .sub{color:rgba(242,231,218,.72)}
  .lnk.hl .ico{background:rgba(242,231,218,.12);border-color:rgba(168,122,56,.6)}
  .lnk.hl .ico svg{stroke:var(--gold)}
  .lnk.hl .arw{stroke:rgba(242,231,218,.6)}

  .ico{
    width:42px;height:42px;flex:none;border-radius:11px;
    background:rgba(168,122,56,.10);
    border:1px solid rgba(168,122,56,.22);
    display:flex;align-items:center;justify-content:center;
  }
  .ico svg{width:20px;height:20px;stroke:none;fill:var(--gold)}
  /* non-brand tiles = solid gold badge with white glyph, exactly like the printed card */
  .lnk .ico:not(.brand){background:var(--gold);border-color:var(--gold);
       box-shadow:0 2px 6px rgba(168,122,56,.35)}
  .lnk .ico:not(.brand) svg{fill:#fff;color:#fff}
  .lnk.hl .ico:not(.brand){background:var(--gold);border-color:rgba(255,255,255,.5)}
  /* official brand logos are solid-filled, never stroked */
  svg.bi{fill:currentColor;stroke:none!important;stroke-width:0!important}
  .ico svg.bi{width:21px;height:21px}
  /* brand tiles get a clean white chip so the real colours read properly */
  .lnk .ico.brand{background:#fff;border-color:rgba(26,49,37,.12);
                  box-shadow:0 1px 3px rgba(26,49,37,.10)}
  .lnk.hl .ico.brand{background:#fff;border-color:rgba(168,122,56,.55)}
  .qbtn svg.bi{width:22px;height:22px}
  .row svg.bi{width:17px;height:17px}

  .txt{flex:1;min-width:0;display:flex;flex-direction:column}
  .ttl{display:block;font-size:14.5px;font-weight:700;letter-spacing:.2px;color:var(--green);line-height:1.3}
  .sub{display:block;font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35;
       overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .arw{width:16px;height:16px;flex:none;stroke:var(--gold);fill:none;stroke-width:2.4;
       stroke-linecap:round;stroke-linejoin:round;opacity:.65}

  /* ================= DETAILS BLOCK ============ */
  .panel{
    margin-top:22px;padding:18px 18px 6px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:16px;
    box-shadow:0 2px 8px rgba(26,49,37,.05);
  }
  .panel h2{
    font-size:10.5px;font-weight:800;letter-spacing:2.6px;text-transform:uppercase;
    color:var(--gold);margin-bottom:12px;
  }
  .row{display:flex;align-items:flex-start;gap:12px;padding:9px 0;border-top:1px solid var(--line)}
  .row:first-of-type{border-top:none}
  .row svg{width:15px;height:15px;flex:none;stroke:none;fill:var(--gold)}
  /* gold circle badge around each contact glyph, like the printed card */
  .row .badge{width:26px;height:26px;flex:none;margin-top:1px;border-radius:50%;
       background:var(--gold);display:flex;align-items:center;justify-content:center;
       box-shadow:0 1px 4px rgba(168,122,56,.35)}
  .row .badge svg{fill:#fff;color:#fff}
  .row .badge svg.bi{width:15px;height:15px}
  .row a,.row span{font-size:13.5px;color:var(--ink);text-decoration:none;line-height:1.5;word-break:break-word}
  .row small{display:block;font-size:10.5px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin-bottom:1px}

  /* ================= BUTTONS ============ */
  .share{display:flex;gap:10px;margin-top:20px}
  .sbtn{
    flex:1;padding:14px;border-radius:14px;
    font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:.18s;
  }
  .sbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .sbtn.primary{background:var(--green);color:var(--cream);border:1px solid var(--green);
                box-shadow:0 8px 20px rgba(26,49,37,.24)}
  .sbtn.ghost{background:transparent;color:var(--green);border:1.5px solid rgba(26,49,37,.24)}
  .sbtn:active{transform:scale(.97);opacity:.9}

  footer{text-align:center;margin-top:28px;font-size:11.5px;color:var(--muted);line-height:1.8}
  .fbrand{font-weight:700;letter-spacing:1.6px;text-transform:uppercase;color:var(--green);opacity:.8}

  .toast{
    position:fixed;left:50%;bottom:32px;transform:translate(-50%,90px);
    background:var(--green);color:var(--cream);
    padding:12px 22px;border-radius:100px;
    font-size:13.5px;font-weight:600;
    box-shadow:0 12px 30px rgba(26,49,37,.35);
    border:1px solid var(--gold);
    opacity:0;transition:.32s cubic-bezier(.2,.9,.3,1.2);z-index:99;pointer-events:none;
  }
  .toast.on{transform:translate(-50%,0);opacity:1}

  .err{margin-top:30px;padding:18px;border-radius:14px;background:#fdeaea;
       border:1px solid #e5a5a5;font-size:13.5px;line-height:1.6;color:#8c2f2f;text-align:left}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

function render(d){
  var p=d.person||d.brand||{}, c=d.contact||{}, th=d.theme||{};

  if(th.cream){ document.documentElement.style.setProperty('--cream',th.cream);
    var m=document.querySelector('meta[name=theme-color]'); if(m) m.content=th.cream; }
  if(th.green) document.documentElement.style.setProperty('--green',th.green);
  if(th.gold)  document.documentElement.style.setProperty('--gold', th.gold);

  document.title=(p.name||'Digital Card')+(p.company?' — '+p.company:'');
  document.getElementById('brandline').textContent=p.company||'';
  document.getElementById('name').textContent=p.name||'';
  document.getElementById('role').textContent=p.role||'';
  document.getElementById('tagline').textContent=p.tagline||'';

  var av=document.getElementById('avatar');
  var pic=p.photo||p.logo;
  av.innerHTML = pic ? '<img src="'+esc(pic)+'" alt="'+esc(p.name)+'">'
                     : esc(p.initials||(p.name||'?').charAt(0));

  if(d.banner&&d.banner.show&&d.banner.text){
    document.getElementById('bannerBox').innerHTML=
      '<span class="banner"><span class="dot"></span>'+esc(d.banner.text)+'</span>';
  }

  /* quick actions */
  var q=[];
  if(c.phone)    q.push({t:'Call',    u:'tel:'+c.phone,              i:'phone'});
  if(c.whatsapp) q.push({t:'WhatsApp',u:'https://wa.me/'+c.whatsapp, i:'whatsapp'});
  if(c.email)    q.push({t:'Email',   u:'mailto:'+c.email,           i:isGmail(c.email)?'gmail':'mail'});
  if(c.address||c.maps_url) q.push({t:'Location',
      u:c.maps_url || ('https://maps.google.com/?q='+encodeURIComponent(c.address)), i:'googlemaps'});
  document.getElementById('quick').innerHTML=q.map(function(x){
    var ext=/^https?:/.test(x.u)?' target="_blank" rel="noopener"':'';
    return '<a class="qbtn" href="'+esc(x.u)+'"'+ext+'>'+svg(x.i)+'<span>'+esc(x.t)+'</span></a>';
  }).join('');

  /* links */
  var list=(d.links||[]).filter(function(l){return l.active!==false&&l.url;});
  document.getElementById('links').innerHTML=list.map(function(l,i){
    return '<a class="lnk'+(l.highlight?' hl':'')+'" href="'+esc(l.url)+
      '" target="_blank" rel="noopener" style="animation-delay:'+(i*0.05)+'s">'+
      '<span class="ico'+(isBrand(l.icon)?' brand':'')+'">'+svg(l.icon)+'</span><span class="txt">'+
      '<span class="ttl">'+esc(l.title)+'</span>'+
      (l.subtitle?'<span class="sub">'+esc(l.subtitle)+'</span>':'')+
      '</span><svg class="arw" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></a>';
  }).join('');

  /* details panel */
  var rows='';
  function row(ic,label,val,href){
    if(!val) return;
    var inner = href ? '<a href="'+esc(href)+'">'+esc(val)+'</a>' : '<span>'+esc(val)+'</span>';
    rows+='<div class="row"><span class="badge">'+svg(ic,{mono:true})+'</span>'+
          '<div><small>'+esc(label)+'</small>'+inner+'</div></div>';
  }
  row('phone','Phone',   niceTel(c.phone), 'tel:'+c.phone);
  if(c.whatsapp) row('whatsapp','WhatsApp', niceTel('+'+String(c.whatsapp)), 'https://wa.me/'+c.whatsapp);
  row('headset','Customer Care', niceTel(c.care), 'tel:'+c.care);
  row(isGmail(c.email)?'gmail':'mail','Email', c.email, 'mailto:'+c.email);
  row('web','Website',   (c.website||'').replace(/^https?:\/\//,'').replace(/\/$/,''), c.website);
  row('googlemaps','Address', c.address,
      c.maps_url || ('https://maps.google.com/?q='+encodeURIComponent(c.address||'')));
  if(rows){
    document.getElementById('detailBox').innerHTML=
      '<div class="panel"><h2>Contact Details</h2>'+rows+'</div>';
  }

  /* buttons */
  document.getElementById('share').innerHTML=
    '<button class="sbtn primary" id="btnSave">'+svg('save')+'Save Contact</button>'+
    '<button class="sbtn ghost" id="btnShare">'+svg('share')+'Share</button>';

  document.getElementById('btnSave').onclick=function(){ saveVCard(p,c,d.links); };
  document.getElementById('btnShare').onclick=function(){
    var data={title:p.name||document.title,text:p.tagline||'',url:location.href};
    if(navigator.share){ navigator.share(data).catch(function(){}); }
    else if(navigator.clipboard){ navigator.clipboard.writeText(location.href); toast('Link copied'); }
    else { toast(location.href); }
  };

  document.getElementById('footer').textContent=d.footer||'';
}

/* ==========================================================
   vCard 3.0 builder — the main feature.
   Saves name, role, company, BOTH phone numbers, WhatsApp,
   email, website, full structured address, social profiles
   and (optionally) the profile photo, straight into the phone.
   ========================================================== */

/* escape , ; and \ as required by the vCard spec */
function vEsc(s){ return String(s==null?'':s).replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n'); }

/* fold long lines at 75 octets — required by RFC 2426, and what makes
   embedded photos import reliably on Android */
function vFold(line){
  if(line.length<=75) return line;
  var out=line.slice(0,75), rest=line.slice(75);
  while(rest.length>74){ out+='\r\n '+rest.slice(0,74); rest=rest.slice(74); }
  if(rest.length) out+='\r\n '+rest;
  return out;
}

function digits(s){ return String(s||'').replace(/\D/g,''); }

function buildVCard(p, c, links, photoData){
  var parts=(p.name||'').trim().split(/\s+/);
  var last=parts.length>1?parts.pop():'', first=parts.join(' ');

  var v=[];
  v.push('BEGIN:VCARD');
  v.push('VERSION:3.0');
  v.push('N:'+vEsc(last)+';'+vEsc(first)+';;;');
  v.push('FN:'+vEsc(p.name));
  if(p.company) v.push('ORG:'+vEsc(p.company));
  if(p.role)    v.push('TITLE:'+vEsc(p.role));

  /* ---- phones. item#.X-ABLabel gives iPhone a real label ---- */
  var item=0, seen={};
  if(c.phone){
    v.push('TEL;TYPE=CELL,VOICE,PREF:'+vEsc(c.phone));
    seen[digits(c.phone)]=1;
  }
  if(c.whatsapp){
    var wa='+'+digits(c.whatsapp);
    if(!seen[digits(wa)]){
      item++;
      v.push('item'+item+'.TEL;TYPE=CELL:'+vEsc(wa));
      v.push('item'+item+'.X-ABLabel:WhatsApp');
      seen[digits(wa)]=1;
    }
  }
  if(c.care && !seen[digits(c.care)]){
    item++;
    v.push('item'+item+'.TEL;TYPE=WORK,VOICE:'+vEsc(c.care));
    v.push('item'+item+'.X-ABLabel:Customer Care');
    seen[digits(c.care)]=1;
  }

  if(c.email) v.push('EMAIL;TYPE=INTERNET,PREF:'+vEsc(c.email));

  /* ---- website ---- */
  if(c.website) v.push('URL:'+vEsc(c.website));

  /* ---- structured address: street;city;region;postcode;country
         so Maps can navigate to it from the contact card ---- */
  var A=c.address_parts;
  if(A){
    v.push('ADR;TYPE=WORK:;;'+vEsc(A.street)+';'+vEsc(A.city)+';'+
           vEsc(A.region)+';'+vEsc(A.postcode)+';'+vEsc(A.country));
    var oneLine=[A.street,A.city,A.region,A.postcode,A.country].filter(Boolean).join(', ');
    v.push('LABEL;TYPE=WORK:'+vEsc(oneLine));
  } else if(c.address){
    v.push('ADR;TYPE=WORK:;;'+vEsc(c.address)+';;;;');
    v.push('LABEL;TYPE=WORK:'+vEsc(c.address));
  }

  /* ---- social profiles + map, as labelled extra URLs.
         Each distinct address is written once only. ---- */
  var urlSeen={};
  function norm(u){ return String(u||'').replace(/\/$/,'').toLowerCase(); }
  if(c.website) urlSeen[norm(c.website)]=1;

  function addUrl(u, label){
    var k=norm(u);
    if(!u || urlSeen[k]) return;
    urlSeen[k]=1;
    item++;
    v.push('item'+item+'.URL:'+vEsc(u));
    v.push('item'+item+'.X-ABLabel:'+vEsc(label));
  }
  (links||[]).forEach(function(l){
    if(l.active===false) return;
    addUrl(l.url, l.title);
  });
  addUrl(c.maps_url, 'Location');

  /* X-SOCIALPROFILE is what iPhone uses to show real social rows */
  (links||[]).forEach(function(l){
    if(l.active===false || !l.url) return;
    var t=String(l.icon||'').toLowerCase();
    if(t==='instagram') v.push('X-SOCIALPROFILE;TYPE=instagram:'+vEsc(l.url));
    if(t==='facebook')  v.push('X-SOCIALPROFILE;TYPE=facebook:'+vEsc(l.url));
  });

  if(p.tagline) v.push('NOTE:'+vEsc(p.tagline));
  v.push('X-CARD-URL:'+vEsc(location.href));

  /* ---- embedded photo (base64) ---- */
  if(photoData){
    v.push('PHOTO;ENCODING=b;TYPE='+photoData.type+':'+photoData.b64);
  }

  v.push('END:VCARD');
  return v.map(vFold).join('\r\n')+'\r\n';
}

/* Read the profile photo and shrink it — big photos break vCard imports,
   so we cap it to 400px and keep it well under ~60KB. */
function loadPhoto(src){
  return new Promise(function(resolve){
    if(!src) return resolve(null);
    var img=new Image();
    img.crossOrigin='anonymous';
    img.onload=function(){
      try{
        var S=400, cv=document.createElement('canvas');
        var s=Math.min(S/img.width, S/img.height, 1);
        cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
        cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
        var url=cv.toDataURL('image/jpeg',0.82);
        resolve({type:'JPEG', b64:url.split(',')[1]});
      }catch(e){ resolve(null); }
    };
    img.onerror=function(){ resolve(null); };
    img.src=src;
  });
}

function saveVCard(p, c, links){
  loadPhoto(p.photo).then(function(photo){
    var text=buildVCard(p, c, links, photo);
    var blob=new Blob([text],{type:'text/vcard;charset=utf-8'});
    var a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download=(p.name||'contact').replace(/\s+/g,'_')+'.vcf';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},1500);
    toast('Contact saved');
  });
}
